<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=1080,initial-scale=0.35">
<title>Slide 4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:grid;place-items:center;min-height:100vh;font-family:-apple-system,system-ui,sans-serif}
.f{width:1080px;height:1920px;background:radial-gradient(ellipse at center,#0a1530 0%,#050507 80%);position:relative;color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 80px}
.bar{position:absolute;top:0;left:0;height:4px;width:100%;background:#1166ff;box-shadow:0 0 12px #1166ff}
.glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:120%;height:80%;background:radial-gradient(ellipse,rgba(17,102,255,.2),transparent 70%);filter:blur(60px);z-index:1}
.brand{font-size:130px;font-weight:300;letter-spacing:-2px;margin-bottom:20px;z-index:5;position:relative}
.brand b{font-weight:800}
.line{width:80px;height:5px;background:#1166ff;box-shadow:0 0 20px #1166ff;margin:20px 0 50px;z-index:5;position:relative}
.tag{font-size:54px;font-weight:700;line-height:1.2;margin-bottom:80px;text-transform:uppercase;letter-spacing:-1px;z-index:5;position:relative}
.tag em{font-style:normal;color:#4d8aff}
.stats{display:flex;gap:70px;margin-bottom:80px;z-index:5;position:relative}
.n{font-family:ui-monospace,monospace;font-size:84px;font-weight:800;color:#4d8aff;line-height:1}
.l{font-size:20px;color:#9aa3b2;letter-spacing:3px;margin-top:12px;text-transform:uppercase}
.handle{font-family:ui-monospace,monospace;font-size:32px;letter-spacing:2px;z-index:5;position:relative}
.url{font-family:ui-monospace,monospace;font-size:22px;color:#9aa3b2;margin-top:10px;z-index:5;position:relative}
.corner{position:absolute;width:80px;height:80px;border:2px solid #1166ff;z-index:5}
.tl{top:40px;left:40px;border-right:0;border-bottom:0}
.tr{top:40px;right:40px;border-left:0;border-bottom:0}
.bl{bottom:40px;left:40px;border-right:0;border-top:0}
.br{bottom:40px;right:40px;border-left:0;border-top:0}
</style></head>
<body><div class="f">
<div class="bar"></div>
<div class="glow"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div class="brand">TOPO<b>SCAN</b></div>
<div class="line"></div>
<div class="tag">Zero margem de erro.<br><em>Para a eternidade.</em></div>
<div class="stats">
  <div><div class="n">10+</div><div class="l">ANOS</div></div>
  <div><div class="n">±2mm</div><div class="l">PRECISÃO</div></div>
  <div><div class="n">360°</div><div class="l">REALIDADE</div></div>
</div>
<div class="handle">@topo.scan</div>
<div class="url">toposcan.com.br</div>
</div></body></html>
