<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>TopoScan — Animação Reels 15s</title>
<style>
  :root {
    --bg: #050507;
    --fg: #ffffff;
    --accent: #1166ff;
    --accent-soft: #4d8aff;
    --muted: #9aa3b2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; overflow: hidden; }
  body {
    display: grid; place-items: center;
    min-height: 100vh;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
  }
  /* Frame 1080x1920 (9:16) escalado para visualização */
  .stage {
    width: 1080px; height: 1920px;
    background: var(--bg);
    position: relative; overflow: hidden;
    color: var(--fg);
    transform-origin: top center;
    transform: scale(0.42);
    margin-bottom: -1110px;
  }
  canvas#scene {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }

  /* === SCENES (texto/UI sobreposto) === */
  .scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center;
    opacity: 0;
    z-index: 5;
    padding: 0 80px;
  }
  /* logo persistente */
  .logo-top {
    position: absolute; top: 80px; left: 80px;
    font-size: 40px; font-weight: 300;
    letter-spacing: -1px;
    color: var(--fg);
    z-index: 20;
    opacity: 0; animation: fadeIn 0.6s 0.3s forwards;
  }
  .logo-top b { font-weight: 800; }
  .status-top {
    position: absolute; top: 86px; right: 80px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: var(--accent-soft);
    letter-spacing: 3px;
    z-index: 20;
    opacity: 0; animation: fadeIn 0.6s 0.6s forwards;
  }
  .status-top::before {
    content: '●'; margin-right: 8px;
    color: var(--accent-soft);
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  @keyframes fadeIn { to { opacity: 1; } }

  /* SCENE 1: 0-3s — Hook */
  .s1 { animation: s1 3s linear forwards; }
  @keyframes s1 {
    0%   { opacity: 0; transform: translateY(20px); }
    15%  { opacity: 1; transform: translateY(0); }
    85%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-20px); }
  }
  .s1 .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    color: var(--accent-soft);
    letter-spacing: 6px;
    margin-bottom: 40px;
  }
  .s1 h1 {
    font-size: 130px; font-weight: 800;
    line-height: 0.95; letter-spacing: -3px;
    text-transform: uppercase;
  }
  .s1 h1 em { font-style: italic; color: var(--accent-soft); }

  /* SCENE 2: 3-6s — Tensão / efeito scan */
  .s2 {
    animation: s2 3s linear 3s forwards;
    justify-content: flex-end;
    padding-bottom: 280px;
  }
  @keyframes s2 {
    0%, 100% { opacity: 0; }
    15%, 85% { opacity: 1; }
  }
  .s2 .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    color: var(--fg);
    letter-spacing: 4px;
    padding: 14px 24px;
    border: 1px solid var(--accent);
    background: rgba(17,102,255,0.1);
    backdrop-filter: blur(8px);
  }

  /* SCENE 3: 6-10s — Revelação */
  .s3 {
    animation: s3 4s linear 6s forwards;
    justify-content: flex-end;
    padding-bottom: 240px;
  }
  @keyframes s3 {
    0%, 100% { opacity: 0; }
    10%, 90% { opacity: 1; }
  }
  .s3 .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--accent-soft);
    letter-spacing: 5px;
    margin-bottom: 24px;
  }
  .s3 h2 {
    font-size: 96px; font-weight: 800;
    line-height: 1; letter-spacing: -2px;
    text-transform: uppercase;
  }
  .s3 h2 span { color: var(--accent-soft); }

  /* SCENE 4: 10-15s — CTA final */
  .s4 {
    animation: s4 5s linear 10s forwards;
    justify-content: center;
  }
  @keyframes s4 {
    0%   { opacity: 0; }
    10%, 100% { opacity: 1; }
  }
  .s4 .brand {
    font-size: 110px; font-weight: 300;
    letter-spacing: -2px;
    margin-bottom: 30px;
  }
  .s4 .brand b { font-weight: 800; }
  .s4 .accent-bar {
    width: 80px; height: 5px;
    background: var(--accent);
    margin: 20px auto 40px;
    box-shadow: 0 0 20px var(--accent);
  }
  .s4 .tagline {
    font-size: 44px; font-weight: 600;
    line-height: 1.25;
    margin-bottom: 60px;
    text-transform: uppercase;
    letter-spacing: -1px;
  }
  .s4 .tagline em {
    font-style: normal;
    color: var(--accent-soft);
  }
  .s4 .stats {
    display: flex; gap: 50px;
    justify-content: center;
    margin-bottom: 60px;
  }
  .s4 .stat .n {
    font-family: 'JetBrains Mono', monospace;
    font-size: 64px; font-weight: 800;
    color: var(--accent-soft);
    line-height: 1;
  }
  .s4 .stat .l {
    font-size: 16px;
    color: var(--muted);
    letter-spacing: 3px;
    margin-top: 8px;
    text-transform: uppercase;
  }
  .s4 .handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    color: var(--fg);
    letter-spacing: 2px;
    margin-top: 20px;
  }
  .s4 .url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--muted);
    margin-top: 8px;
  }

  /* scanline geral */
  .scanline {
    position: absolute; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 24px var(--accent);
    z-index: 6; mix-blend-mode: screen;
    animation: scanMove 4s linear infinite;
  }
  @keyframes scanMove {
    0% { top: 0%; opacity: 0; }
    10%, 90% { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }

  /* botão de replay */
  .replay {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: var(--accent);
    color: white;
    border: 0;
    padding: 14px 28px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 4px 20px rgba(17,102,255,0.4);
  }
  .replay:hover { background: var(--accent-soft); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="scene" width="1080" height="1920"></canvas>
  <div class="scanline"></div>
  <div class="logo-top">TOPO<b>SCAN</b></div>
  <div class="status-top">REC · 4K</div>

  <!-- Cena 1 -->
  <div class="scene s1">
    <div class="eyebrow">PATRIMÔNIO · ETERNO</div>
    <h1>E SE DESAPARECESSE<br><em>AMANHÃ?</em></h1>
  </div>

  <!-- Cena 2 -->
  <div class="scene s2">
    <div class="label">SCANNING · 14.2M POINTS</div>
  </div>

  <!-- Cena 3 -->
  <div class="scene s3">
    <div class="eyebrow">PRECISÃO · ±2MM</div>
    <h2>A GENTE PRESERVARIA<br>CADA <span>MILÍMETRO.</span></h2>
  </div>

  <!-- Cena 4 -->
  <div class="scene s4">
    <div class="brand">TOPO<b>SCAN</b></div>
    <div class="accent-bar"></div>
    <div class="tagline">Zero margem de erro.<br><em>Para a eternidade.</em></div>
    <div class="stats">
      <div class="stat"><div class="n">10+</div><div class="l">ANOS</div></div>
      <div class="stat"><div class="n">±2mm</div><div class="l">PRECISÃO</div></div>
      <div class="stat"><div class="n">360°</div><div class="l">REALIDADE</div></div>
    </div>
    <div class="handle">@topo.scan</div>
    <div class="url">toposcan.com.br</div>
  </div>
</div>
<button class="replay" onclick="restart()">REINICIAR · GRAVAR</button>

<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// === gera silhueta de igreja em pontos ===
function genChurch() {
  const pts = [];
  const cx = W/2, cy = H*0.45;
  const s = 1.5;
  // nave
  for (let i = 0; i < 2400; i++) pts.push([cx + (Math.random()-0.5)*720*s, cy + Math.random()*380*s]);
  // colunas
  for (let col = -2; col <= 2; col++) {
    if (col === 0) continue;
    for (let i = 0; i < 320; i++)
      pts.push([cx + col*160*s + (Math.random()-0.5)*8, cy + Math.random()*380*s]);
  }
  // telhado
  for (let i = 0; i < 1200; i++) {
    const t = Math.random();
    pts.push([cx + (Math.random()-0.5)*720*(1-t)*s, cy - t*240*s]);
  }
  // campanário
  for (let i = 0; i < 1000; i++)
    pts.push([cx + (Math.random()-0.5)*160*s, cy - 240*s - Math.random()*280*s]);
  // topo campanário
  for (let i = 0; i < 450; i++) {
    const t = Math.random();
    pts.push([cx + (Math.random()-0.5)*160*(1-t)*s, cy - 520*s - t*120*s]);
  }
  // cruz vertical
  for (let i = 0; i < 90; i++)
    pts.push([cx + (Math.random()-0.5)*10, cy - 640*s - Math.random()*100*s]);
  // cruz horizontal
  for (let i = 0; i < 45; i++)
    pts.push([cx + (Math.random()-0.5)*70, cy - 680*s + (Math.random()-0.5)*10]);
  return pts;
}

const churchPts = genChurch();

// posições aleatórias dispersas (estado inicial — caos)
const dispersedPts = churchPts.map(([x,y]) => [
  Math.random() * W,
  Math.random() * H,
  x, y // destino
]);

// === animation loop ===
let t0 = performance.now();
const DURATION = 15000; // 15s
let animId;

function lerp(a,b,t){ return a + (b-a)*t; }
function ease(t){ return t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; }

function frame() {
  const t = (performance.now() - t0) / DURATION; // 0..1
  ctx.fillStyle = '#050507';
  ctx.fillRect(0, 0, W, H);

  // fundo gradient
  const bg = ctx.createRadialGradient(W/2, H*0.45, 100, W/2, H*0.45, H*0.7);
  bg.addColorStop(0, '#0a1530');
  bg.addColorStop(1, '#050507');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // --- fases ---
  // 0.00-0.20: vazio (cena 1 mostra só hook)
  // 0.20-0.40: pontos caóticos aparecem (cena 2 — scanning)
  // 0.40-0.70: pontos se organizam em igreja (cena 3 — revelação)
  // 0.70-1.00: igreja se transforma em "modelo" wireframe limpo (cena 4)

  if (t < 0.18) {
    // ruído sutil de fundo
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#1166ff';
    for (let i = 0; i < 80; i++) {
      ctx.fillRect(Math.random()*W, Math.random()*H, 1, 1);
    }
  } else if (t < 0.40) {
    // pontos caóticos aparecem
    const phase = (t - 0.18) / 0.22; // 0..1
    const visibleCount = Math.floor(dispersedPts.length * phase);
    ctx.shadowColor = '#1166ff';
    ctx.shadowBlur = 4;
    for (let i = 0; i < visibleCount; i++) {
      const [x, y] = dispersedPts[i];
      ctx.globalAlpha = Math.random() * 0.6 + 0.3;
      ctx.fillStyle = Math.random() < 0.2 ? '#ffffff' : '#4d8aff';
      ctx.fillRect(x, y, Math.random()*2+0.6, Math.random()*2+0.6);
    }
  } else if (t < 0.70) {
    // morph: dispersos → igreja
    const phase = ease((t - 0.40) / 0.30);
    ctx.shadowColor = '#1166ff';
    ctx.shadowBlur = 4;
    for (const [sx, sy, dx, dy] of dispersedPts) {
      const x = lerp(sx, dx, phase);
      const y = lerp(sy, dy, phase);
      const r = Math.random();
      ctx.fillStyle = r < 0.15 ? '#ffffff' : (r < 0.55 ? '#4d8aff' : '#1166ff');
      ctx.globalAlpha = Math.random()*0.5 + 0.4;
      ctx.fillRect(x, y, Math.random()*1.8+0.6, Math.random()*1.8+0.6);
    }
  } else {
    // igreja estável + leve "respiração"
    const breathe = Math.sin((t - 0.70) * Math.PI * 4) * 1.5;
    ctx.shadowColor = '#1166ff';
    ctx.shadowBlur = 6;
    for (const [,, dx, dy] of dispersedPts) {
      const r = Math.random();
      ctx.fillStyle = r < 0.15 ? '#ffffff' : (r < 0.55 ? '#4d8aff' : '#1166ff');
      ctx.globalAlpha = Math.random()*0.5 + 0.4;
      const jx = (Math.random()-0.5) * 0.8;
      const jy = (Math.random()-0.5) * 0.8;
      ctx.fillRect(dx + jx, dy + jy + breathe, Math.random()*1.8+0.6, Math.random()*1.8+0.6);
    }
    // wireframe overlay (linhas)
    ctx.shadowBlur = 0;
    ctx.globalAlpha = (t - 0.70) / 0.30 * 0.4;
    ctx.strokeStyle = '#4d8aff';
    ctx.lineWidth = 1.5;
    const cx = W/2, cy = H*0.45, s = 1.5;
    ctx.beginPath();
    // contorno simplificado
    ctx.moveTo(cx - 360*s, cy + 380*s);
    ctx.lineTo(cx - 360*s, cy);
    ctx.lineTo(cx - 80*s, cy);
    ctx.lineTo(cx - 80*s, cy - 240*s);
    ctx.lineTo(cx - 80*s, cy - 520*s);
    ctx.lineTo(cx - 80*s, cy - 640*s);
    ctx.moveTo(cx + 80*s, cy - 640*s);
    ctx.lineTo(cx + 80*s, cy - 520*s);
    ctx.lineTo(cx + 80*s, cy - 240*s);
    ctx.lineTo(cx + 80*s, cy);
    ctx.lineTo(cx + 360*s, cy);
    ctx.lineTo(cx + 360*s, cy + 380*s);
    ctx.stroke();
    // cruz
    ctx.beginPath();
    ctx.moveTo(cx, cy - 640*s);
    ctx.lineTo(cx, cy - 740*s);
    ctx.moveTo(cx - 35*s, cy - 680*s);
    ctx.lineTo(cx + 35*s, cy - 680*s);
    ctx.stroke();
  }

  if (t < 1) animId = requestAnimationFrame(frame);
}

function restart() {
  cancelAnimationFrame(animId);
  // re-trigger CSS animations
  const s = document.getElementById('stage');
  const clone = s.cloneNode(true);
  s.parentNode.replaceChild(clone, s);
  t0 = performance.now();
  frame();
}

frame();
</script>
</body>
</html>
