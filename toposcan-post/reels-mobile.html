<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TopoScan Reels</title>
<style>
  :root {
    --bg: #050507;
    --fg: #ffffff;
    --accent: #1166ff;
    --accent-soft: #4d8aff;
    --muted: #9aa3b2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    height: 100%; width: 100%;
    overflow: hidden;
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    position: fixed; inset: 0;
  }

  .stage {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center top, #0a1530 0%, #050507 70%);
    overflow: hidden;
  }

  /* nuvem de pontos CSS — sem canvas, mais leve e confiável */
  .cloud {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 80vw; height: 80vh;
    pointer-events: none;
  }
  .pt {
    position: absolute;
    width: 2px; height: 2px;
    background: var(--accent-soft);
    border-radius: 50%;
    box-shadow: 0 0 4px var(--accent);
    opacity: 0;
    animation: appear 15s linear infinite;
  }
  @keyframes appear {
    0%, 18% { opacity: 0; transform: translate(var(--rx), var(--ry)) scale(0); }
    25%, 40% { opacity: 0.8; transform: translate(var(--rx), var(--ry)) scale(1); }
    55%, 95% { opacity: 0.8; transform: translate(var(--dx), var(--dy)) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); }
  }

  /* topo */
  .logo-top {
    position: absolute; top: 5vh; left: 5vw;
    font-size: 4.5vw; font-weight: 300; letter-spacing: -0.5px;
    z-index: 30; opacity: 0;
    animation: fade1 15s linear infinite;
  }
  .logo-top b { font-weight: 800; }
  @keyframes fade1 { 0% {opacity:0} 5%, 100% {opacity:1} }

  .status-top {
    position: absolute; top: 5.6vh; right: 5vw;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 2.6vw; color: var(--accent-soft);
    letter-spacing: 2px; z-index: 30;
    opacity: 0;
    animation: fade2 15s linear infinite;
  }
  .status-top::before {
    content: '●'; margin-right: 6px;
    animation: blink 1.2s infinite;
  }
  @keyframes fade2 { 0% {opacity:0} 6%, 100% {opacity:1} }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* progress bar topo */
  .progress {
    position: absolute; top: 0; left: 0;
    height: 3px; background: var(--accent);
    z-index: 50; width: 0;
    animation: prog 15s linear infinite;
  }
  @keyframes prog {
    0% { width: 0%; }
    100% { width: 100%; }
  }

  /* cenas */
  .scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; padding: 0 7vw;
    opacity: 0;
  }

  /* S1 — hook (0-3s = 0-20%) */
  .s1 { animation: s1 15s linear infinite; }
  @keyframes s1 {
    0% { opacity: 0; transform: translateY(20px); }
    3% { opacity: 1; transform: translateY(0); }
    18% { opacity: 1; transform: translateY(0); }
    20% { opacity: 0; transform: translateY(-20px); }
    100% { opacity: 0; }
  }
  .s1 .eyebrow {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 3vw; color: var(--accent-soft);
    letter-spacing: 6px; margin-bottom: 3vh;
  }
  .s1 h1 {
    font-size: 13.5vw; font-weight: 800;
    line-height: 0.95; letter-spacing: -1.5px;
    text-transform: uppercase;
  }
  .s1 h1 em { font-style: italic; color: var(--accent-soft); }

  /* S2 — scanning (3-6s = 20-40%) */
  .s2 { animation: s2 15s linear infinite; justify-content: flex-end; padding-bottom: 22vh; }
  @keyframes s2 {
    0%, 20% { opacity: 0; }
    23%, 37% { opacity: 1; }
    40%, 100% { opacity: 0; }
  }
  .s2 .label {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 3.6vw; letter-spacing: 3px;
    padding: 12px 22px;
    border: 1px solid var(--accent);
    background: rgba(17,102,255,0.12);
  }

  /* S3 — revelação (6-10s = 40-66%) */
  .s3 { animation: s3 15s linear infinite; justify-content: flex-end; padding-bottom: 14vh; }
  @keyframes s3 {
    0%, 40% { opacity: 0; }
    43%, 63% { opacity: 1; }
    66%, 100% { opacity: 0; }
  }
  .s3 .eyebrow {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 2.8vw; color: var(--accent-soft);
    letter-spacing: 5px; margin-bottom: 2vh;
  }
  .s3 h2 {
    font-size: 10vw; font-weight: 800;
    line-height: 1; letter-spacing: -1px;
    text-transform: uppercase;
  }
  .s3 h2 span { color: var(--accent-soft); }

  /* S4 — CTA (10-15s = 66-100%) */
  .s4 { animation: s4 15s linear infinite; justify-content: center; }
  @keyframes s4 {
    0%, 66% { opacity: 0; }
    70%, 98% { opacity: 1; }
    100% { opacity: 0; }
  }
  .s4 .brand {
    font-size: 11vw; font-weight: 300;
    letter-spacing: -1px; margin-bottom: 2vh;
  }
  .s4 .brand b { font-weight: 800; }
  .s4 .accent-bar {
    width: 60px; height: 4px;
    background: var(--accent); margin: 1vh auto 3vh;
    box-shadow: 0 0 14px var(--accent);
  }
  .s4 .tagline {
    font-size: 5.6vw; font-weight: 700;
    line-height: 1.25; margin-bottom: 5vh;
    text-transform: uppercase; letter-spacing: -0.5px;
  }
  .s4 .tagline em { font-style: normal; color: var(--accent-soft); }
  .s4 .stats {
    display: flex; gap: 6vw; justify-content: center;
    margin-bottom: 4vh;
  }
  .s4 .stat .n {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 7.5vw; font-weight: 800;
    color: var(--accent-soft); line-height: 1;
  }
  .s4 .stat .l {
    font-size: 2.4vw; color: var(--muted);
    letter-spacing: 2px; margin-top: 6px;
    text-transform: uppercase;
  }
  .s4 .handle {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 4vw; letter-spacing: 1.5px; margin-top: 2vh;
  }
  .s4 .url {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 3vw; color: var(--muted); margin-top: 1vh;
  }

  /* scanline */
  .scanline {
    position: absolute; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 18px var(--accent);
    z-index: 12; mix-blend-mode: screen;
    opacity: 0;
    animation: scan 5s linear infinite;
  }
  @keyframes scan {
    0% { top: 0; opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { top: 100%; opacity: 0; }
  }

  /* hint inicial — desaparece após 5s */
  .hint {
    position: fixed; bottom: 6vh; left: 50%;
    transform: translateX(-50%);
    font-family: ui-monospace, monospace;
    font-size: 2.6vw; color: rgba(255,255,255,0.4);
    letter-spacing: 2px; z-index: 99;
    animation: hideHint 5s linear forwards;
    pointer-events: none;
  }
  @keyframes hideHint {
    0%, 80% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="progress"></div>
  <div class="cloud" id="cloud"></div>
  <div class="scanline"></div>

  <div class="logo-top">TOPO<b>SCAN</b></div>
  <div class="status-top">REC · 4K</div>

  <div class="scene s1">
    <div class="eyebrow">PATRIMÔNIO · ETERNO</div>
    <h1>E SE DESAPARECESSE<br><em>AMANHÃ?</em></h1>
  </div>
  <div class="scene s2">
    <div class="label">SCANNING · 14.2M POINTS</div>
  </div>
  <div class="scene s3">
    <div class="eyebrow">PRECISÃO · ±2MM</div>
    <h2>A GENTE PRESERVARIA<br>CADA <span>MILÍMETRO.</span></h2>
  </div>
  <div class="scene s4">
    <div class="brand">TOPO<b>SCAN</b></div>
    <div class="accent-bar"></div>
    <div class="tagline">Zero margem de erro.<br><em>Para a eternidade.</em></div>
    <div class="stats">
      <div class="stat"><div class="n">10+</div><div class="l">ANOS</div></div>
      <div class="stat"><div class="n">±2mm</div><div class="l">PRECISÃO</div></div>
      <div class="stat"><div class="n">360°</div><div class="l">REALIDADE</div></div>
    </div>
    <div class="handle">@topo.scan</div>
    <div class="url">toposcan.com.br</div>
  </div>
</div>

<div class="hint">LOOP · 15s · GRAVE A TELA</div>

<script>
// gera nuvem de pontos em silhueta de igreja (CSS-only via custom props)
(function(){
  const cloud = document.getElementById('cloud');
  const W = window.innerWidth, H = window.innerHeight;
  const cw = W * 0.8, ch = H * 0.8;
  const cx = cw/2, cy = ch * 0.5;
  const s = Math.min(cw, ch*0.55) / 800;

  function addPoint(dx, dy) {
    // posição aleatória dispersa
    const rx = (Math.random() - 0.5) * cw;
    const ry = (Math.random() - 0.5) * ch;
    // destino na silhueta (relativo ao centro do cloud)
    const tx = dx - cx;
    const ty = dy - cy;
    const el = document.createElement('div');
    el.className = 'pt';
    el.style.left = '50%';
    el.style.top = '50%';
    el.style.setProperty('--rx', rx + 'px');
    el.style.setProperty('--ry', ry + 'px');
    el.style.setProperty('--dx', tx + 'px');
    el.style.setProperty('--dy', ty + 'px');
    el.style.animationDelay = (-Math.random() * 0.5) + 's';
    // variação de cor
    const r = Math.random();
    if (r < 0.15) el.style.background = '#ffffff';
    else if (r < 0.55) el.style.background = '#4d8aff';
    else el.style.background = '#1166ff';
    // variação de tamanho
    const size = (Math.random() * 2 + 1) + 'px';
    el.style.width = size;
    el.style.height = size;
    cloud.appendChild(el);
  }

  // QUANTIDADE — não exagerar pra não travar celular
  const N = 350;
  // distribuição: nave + telhado + campanário + cruz
  for (let i = 0; i < N * 0.35; i++) { // nave
    addPoint(cx + (Math.random()-0.5)*600*s, cy + Math.random()*300*s);
  }
  for (let i = 0; i < N * 0.15; i++) { // telhado
    const t = Math.random();
    addPoint(cx + (Math.random()-0.5)*600*(1-t)*s, cy - t*200*s);
  }
  for (let i = 0; i < N * 0.20; i++) { // campanário
    addPoint(cx + (Math.random()-0.5)*140*s, cy - 200*s - Math.random()*220*s);
  }
  for (let i = 0; i < N * 0.08; i++) { // topo campanário
    const t = Math.random();
    addPoint(cx + (Math.random()-0.5)*140*(1-t)*s, cy - 420*s - t*100*s);
  }
  for (let i = 0; i < N * 0.04; i++) { // cruz vertical
    addPoint(cx + (Math.random()-0.5)*8, cy - 520*s - Math.random()*80*s);
  }
  for (let i = 0; i < N * 0.02; i++) { // cruz horizontal
    addPoint(cx + (Math.random()-0.5)*60, cy - 560*s + (Math.random()-0.5)*8);
  }
  // colunas laterais
  for (let col of [-1.5, 1.5]) {
    for (let i = 0; i < N * 0.08; i++) {
      addPoint(cx + col*140*s, cy + Math.random()*300*s);
    }
  }
})();
</script>
</body>
</html>
