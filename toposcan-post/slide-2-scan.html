<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=1080,initial-scale=0.35">
<title>Slide 2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:grid;place-items:center;min-height:100vh;font-family:-apple-system,system-ui,sans-serif}
.f{width:1080px;height:1920px;background:radial-gradient(ellipse at center,#0a1530 0%,#050507 80%);position:relative;color:#fff;overflow:hidden}
.logo{position:absolute;top:80px;left:80px;font-size:44px;font-weight:300;letter-spacing:-1px;z-index:10}
.logo b{font-weight:800}
.status{position:absolute;top:90px;right:80px;font-family:ui-monospace,monospace;font-size:18px;color:#4d8aff;letter-spacing:3px;z-index:10}
.status::before{content:'● ';color:#4d8aff}
.bar{position:absolute;top:0;left:0;height:4px;width:38%;background:#1166ff;box-shadow:0 0 12px #1166ff;z-index:10}
svg{position:absolute;inset:0;width:100%;height:100%}
.scanline{position:absolute;top:55%;left:0;right:0;height:8px;background:linear-gradient(90deg,transparent,#1166ff,transparent);box-shadow:0 0 40px #1166ff,0 0 80px #1166ff;z-index:5}
.label{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);font-family:ui-monospace,monospace;font-size:34px;color:#fff;letter-spacing:6px;padding:22px 38px;border:2px solid #1166ff;background:rgba(17,102,255,0.18);z-index:10}
.coords{position:absolute;bottom:120px;left:80px;font-family:ui-monospace,monospace;font-size:20px;color:rgba(255,255,255,.55);line-height:1.8;z-index:10;letter-spacing:1px}
.coords b{color:#4d8aff;font-weight:400}
.tag{position:absolute;top:200px;left:80px;font-family:ui-monospace,monospace;font-size:18px;color:#4d8aff;letter-spacing:4px;z-index:10}
</style></head>
<body><div class="f">
<div class="bar"></div>
<svg id="pts"></svg>
<div class="scanline"></div>
<div class="logo">TOPO<b>SCAN</b></div>
<div class="status">REC · 4K</div>
<div class="tag">SCAN · 03 · LIVE</div>
<div class="label">SCANNING · 14.2M POINTS</div>
<div class="coords">LAT&nbsp;&nbsp;<b>-27.5954°</b><br>LONG&nbsp;<b>-48.5480°</b><br>PRECISION&nbsp;<b>±2MM</b></div>
<script>
const svg = document.getElementById('pts');
svg.setAttribute('viewBox', '0 0 1080 1920');
function pt(x, y) {
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', x); c.setAttribute('cy', y);
  c.setAttribute('r', Math.random()*1.5 + 0.6);
  const r = Math.random();
  c.setAttribute('fill', r<0.15?'#fff':(r<0.55?'#4d8aff':'#1166ff'));
  c.setAttribute('opacity', Math.random()*0.6 + 0.3);
  svg.appendChild(c);
}
// pontos densos espalhados pela tela inteira
for (let i = 0; i < 1500; i++) pt(Math.random()*1080, Math.random()*1920);
// concentrações em formação aleatória (como scan ativo)
for (let i = 0; i < 600; i++) {
  const cx = 540, cy = 600 + Math.random()*400;
  pt(cx + (Math.random()-0.5)*800, cy + (Math.random()-0.5)*400);
}
</script>
</div></body></html>
