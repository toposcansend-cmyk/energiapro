<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=1080,initial-scale=0.35">
<title>Slide 1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:grid;place-items:center;min-height:100vh;font-family:-apple-system,system-ui,sans-serif}
.f{width:1080px;height:1920px;background:radial-gradient(ellipse at center top,#0a1530 0%,#050507 70%);position:relative;color:#fff;overflow:hidden}
.logo{position:absolute;top:80px;left:80px;font-size:44px;font-weight:300;letter-spacing:-1px}
.logo b{font-weight:800}
.status{position:absolute;top:90px;right:80px;font-family:ui-monospace,monospace;font-size:18px;color:#4d8aff;letter-spacing:3px}
.status::before{content:'● ';color:#4d8aff}
.bar{position:absolute;top:0;left:0;height:4px;width:18%;background:#1166ff;box-shadow:0 0 12px #1166ff}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:100%;padding:0 60px}
.eye{font-family:ui-monospace,monospace;font-size:24px;color:#4d8aff;letter-spacing:6px;margin-bottom:50px}
h1{font-size:108px;font-weight:800;line-height:1.0;letter-spacing:-2px;text-transform:uppercase}
h1 em{font-style:italic;color:#4d8aff;display:block;margin-top:18px}
.dots{position:absolute;inset:0;opacity:.15}
.dots::before{content:'';position:absolute;inset:0;background-image:radial-gradient(#1166ff 1px,transparent 1px);background-size:30px 30px}
.scanline{position:absolute;top:62%;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#1166ff 50%,transparent);box-shadow:0 0 24px #1166ff;opacity:.6}
</style></head>
<body><div class="f">

<div class="dots"></div>

<h1>E SE<br>DESAPARECESSE<br><em>AMANHÃ?</em></h1>
</div>
</div></body></html>
