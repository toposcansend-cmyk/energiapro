<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnergiaPro — Painel</title>
  <meta name="description" content="Painel de eficiência energética inteligente com IA para seu comércio.">
  <meta name="theme-color" content="#0A0E1A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="app-sidebar__logo">
        <span style="font-size:1.4rem;">⚡</span>
        <span>EnergiaPro</span>
      </div>
      <nav class="app-sidebar__nav" id="sidebar-nav">
        <button class="app-sidebar__link app-sidebar__link--active" data-page="profile" id="nav-profile">
          <span class="app-sidebar__link-icon">📋</span> Perfil do Estabelecimento
        </button>
        <button class="app-sidebar__link" data-page="bill" id="nav-bill">
          <span class="app-sidebar__link-icon">📄</span> Análise de Conta
        </button>
        <button class="app-sidebar__link" data-page="equipment" id="nav-equipment">
          <span class="app-sidebar__link-icon">📸</span> Mapeamento de Cargas
        </button>
        <button class="app-sidebar__link" data-page="insights" id="nav-insights">
          <span class="app-sidebar__link-icon">💡</span> Diagnóstico & Insights
        </button>
        <button class="app-sidebar__link" data-page="dashboard" id="nav-dashboard">
          <span class="app-sidebar__link-icon">📊</span> Painel de Gestão
        </button>
      </nav>
      <div class="app-sidebar__user" id="sidebar-user">
        <div class="app-sidebar__avatar" id="user-avatar">U</div>
        <div>
          <div class="app-sidebar__username" id="user-name">Usuário</div>
          <div class="app-sidebar__email" id="user-email">email@example.com</div>
        </div>
        <button class="btn btn--ghost btn--sm" id="btn-logout" title="Sair" style="margin-left:auto;">🚪</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="app-main" id="app-main">
      <!-- Topbar (mobile) -->
      <div class="app-topbar">
        <button class="mobile-menu-toggle" id="mobile-menu-toggle">☰</button>
        <h2 class="app-topbar__title" id="page-title">Perfil do Estabelecimento</h2>
        <div class="app-topbar__actions" id="topbar-actions"></div>
      </div>

      <!-- Stepper -->
      <div class="stepper" id="app-stepper" style="margin-bottom: var(--space-8);">
        <div class="stepper__step stepper__step--active" data-step="1">
          <div class="stepper__number">1</div>
          <span class="stepper__label">Perfil</span>
        </div>
        <div class="stepper__connector"></div>
        <div class="stepper__step" data-step="2">
          <div class="stepper__number">2</div>
          <span class="stepper__label">Conta</span>
        </div>
        <div class="stepper__connector"></div>
        <div class="stepper__step" data-step="3">
          <div class="stepper__number">3</div>
          <span class="stepper__label">Equipamentos</span>
        </div>
        <div class="stepper__connector"></div>
        <div class="stepper__step" data-step="4">
          <div class="stepper__number">4</div>
          <span class="stepper__label">Diagnóstico</span>
        </div>
        <div class="stepper__connector"></div>
        <div class="stepper__step" data-step="5">
          <div class="stepper__number">5</div>
          <span class="stepper__label">Dashboard</span>
        </div>
      </div>

      <!-- Dynamic Page Content -->
      <div id="page-content">
        <!-- Content injected by JS -->
      </div>
    </main>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
    <div class="mobile-bottom-nav__items">
      <button class="mobile-bottom-nav__item mobile-bottom-nav__item--active" data-page="profile">
        <span class="mobile-bottom-nav__item-icon">📋</span>
        Perfil
      </button>
      <button class="mobile-bottom-nav__item" data-page="bill">
        <span class="mobile-bottom-nav__item-icon">📄</span>
        Conta
      </button>
      <button class="mobile-bottom-nav__item" data-page="equipment">
        <span class="mobile-bottom-nav__item-icon">📸</span>
        Cargas
      </button>
      <button class="mobile-bottom-nav__item" data-page="insights">
        <span class="mobile-bottom-nav__item-icon">💡</span>
        Insights
      </button>
      <button class="mobile-bottom-nav__item" data-page="dashboard">
        <span class="mobile-bottom-nav__item-icon">📊</span>
        Painel
      </button>
    </div>
  </nav>

  <!-- Loading Overlay -->
  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="spinner spinner--lg"></div>
    <div class="loading-overlay__text" id="loading-text">Analisando com IA...</div>
    <div class="loading-overlay__subtext" id="loading-subtext">Processando sua solicitação</div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Modal Container -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="modal">
      <div class="modal__header">
        <h3 class="modal__title" id="modal-title">Modal</h3>
        <button class="modal__close" id="modal-close">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/bill-analysis.js"></script>
  <script src="js/equipment.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
